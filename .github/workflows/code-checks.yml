name: Code checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall analysis
      - name: Import analysis modules
        env:
          PYTHONPATH: analysis
        run: python -c "import adapters, benchmark_metrics, incidents_preprocessing, loader, weight_preprocessing"
